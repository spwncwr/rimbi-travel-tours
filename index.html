<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rimbi Travel & Tours | Travel Beyond Boundaries</title>

    <meta
        name="description"
        content="Rimbi Travel & Tours — reliable passenger transport, private coach hire and shuttle services."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f5;
            color: #171717;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* =========================
           NAVIGATION
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(12px);
        }

        .nav {
            max-width: 1200px;
            margin: auto;
            height: 78px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .logo span {
            color: #e7b84b;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #e7b84b;
        }

        .book-btn {
            background: #e7b84b;
            color: #111 !important;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: 800 !important;
        }

        .book-btn:hover {
            background: #fff;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 760px;
            padding: 150px 24px 100px;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.90),
                    rgba(0, 0, 0, 0.60),
                    rgba(0, 0, 0, 0.25)
                ),
                url("https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1800&q=85")
                center/cover;
        }

        .hero-content {
            max-width: 1200px;
            width: 100%;
            margin: auto;
            color: white;
        }

        .hero-tag {
            color: #e7b84b;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(48px, 7vw, 88px);
            line-height: 0.98;
            max-width: 850px;
            margin-bottom: 25px;
            letter-spacing: -3px;
        }

        .hero h1 span {
            color: #e7b84b;
        }

        .hero p {
            max-width: 620px;
            font-size: 19px;
            color: #e5e5e5;
            margin-bottom: 38px;
        }

        .hero-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .primary-btn,
        .secondary-btn {
            display: inline-block;
            padding: 15px 25px;
            border-radius: 5px;
            font-weight: 800;
            transition: 0.3s;
        }

        .primary-btn {
            background: #e7b84b;
            color: #111;
        }

        .primary-btn:hover {
            background: white;
            transform: translateY(-2px);
        }

        .secondary-btn {
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
        }

        .secondary-btn:hover {
            background: white;
            color: #111;
        }

        /* =========================
           SEARCH BOX
        ========================= */

        .search-wrapper {
            max-width: 1200px;
            margin: -65px auto 0;
            position: relative;
            z-index: 10;
            padding: 0 24px;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.14);
        }

        .search-title {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 0.7fr auto;
            gap: 12px;
        }

        .field {
            border: 1px solid #ddd;
            padding: 13px 15px;
            border-radius: 5px;
            background: #fafafa;
        }

        .field label {
            display: block;
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .field input,
        .field select {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
        }
